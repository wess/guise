name: Release

# Runs when a version tag (v*) is pushed, or manually for a given tag. It cuts
# the GitHub release for the `guise-ui` library, with notes from the CHANGELOG.
# Publishing to crates.io stays a manual step (see the note at the bottom).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  # Create the GitHub Release, with notes from the CHANGELOG.
  github-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve the tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # Prefer the hand-written CHANGELOG section for this version — a list of
      # commit subjects is not release notes. Falls back to generated notes for
      # a tag the changelog doesn't cover.
      - name: Extract the changelog section
        id: notes
        run: |
          VERSION="${{ steps.tag.outputs.tag }}"
          VERSION="${VERSION#v}"
          if [ -f CHANGELOG.md ] && awk -v v="## $VERSION" '$0 ~ "^"v" " || $0 == v {found=1} END {exit !found}' CHANGELOG.md; then
            awk -v v="## $VERSION" '
              $0 ~ "^"v" " || $0 == v {inside=1; next}
              inside && /^## / {exit}
              inside {print}
            ' CHANGELOG.md > release-notes.md
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
          elif [ "${{ steps.notes.outputs.have_notes }}" = "true" ]; then
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi

  # crates.io publishing is deliberately manual, not blocked: the library builds
  # against plain crates.io `gpui = "0.2.2"` with no patch section, so
  # `cargo publish -p guise-ui` works. It stays a human step because publishing
  # is irreversible — a version can be yanked but never replaced.
