name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build, test and lint on macOS — guise targets gpui's native renderer, and
  # the default `webview` feature uses the system WebKit (no extra deps there).
  check:
    name: build · test · clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      # Advisory: surfaces lints without failing the pipeline.
      - name: Clippy
        run: cargo clippy --workspace --all-targets
        continue-on-error: true

  # Advisory formatting check (does not block — run `cargo fmt` to apply).
  fmt:
    name: rustfmt (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: rustfmt
      - name: Format check
        run: cargo fmt --all --check
        continue-on-error: true

  # Verify the documentation site builds (it is deployed by pages.yml).
  site:
    name: site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - name: Install
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Build site
        working-directory: site
        run: bun run build.ts
