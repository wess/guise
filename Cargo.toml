[workspace]
resolver = "2"
members = [
    "crates/guise",
    "crates/gallery",
]

[workspace.package]
version = "1.9.1"
edition = "2021"
license = "MIT"
authors = ["Wess Cope <opensource@wess.io>"]
repository = "https://github.com/wess/guise"
homepage = "https://github.com/wess/guise"
documentation = "https://docs.rs/guise"
keywords = ["gpui", "ui", "components", "desktop"]
categories = ["gui"]

[workspace.dependencies]
gpui = "0.2.2"
guise-ui = { path = "crates/guise" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "96285fc1" }

# Sinclair carries the zed gpui snapshot that also supplies gpui_platform.
# Keep this compatibility branch testable on that exact API surface.
[patch.crates-io]
gpui = { git = "https://github.com/zed-industries/zed", rev = "96285fc1" }
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }

[profile.dev]
debug = "limited"

# Dependencies at opt-level 2, our own crates still at 0. gpui's layout, text
# shaping and scene building run every frame, and at opt-level 0 they make
# `cargo run -p gallery` visibly sluggish while release is fine. Dependencies
# rebuild only when the lockfile changes, so it costs one slower first build
# and nothing after; edits to guise itself keep the fast debug loop.
[profile.dev.package."*"]
opt-level = 2

# What this repo's own binaries are built with. A library's profile does not
# reach its consumers — Cargo only reads the one in the final crate's workspace
# — so this is for the gallery and the examples, and doubles as the recipe an
# app can copy. On the gallery it takes 13.2 MB to 7.5 MB.
#
# `panic = "abort"` drops ~1.5 MB of landing pads and unwind tables. It costs
# nothing in behaviour: gpui only catches panics in its test harness, which
# Cargo builds under the test profile with unwinding forced back on.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
