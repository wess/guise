[workspace]
resolver = "2"
members = [
    "crates/guise",
    "crates/gallery",
    "crates/tailor/model",
    "crates/tailor/codegen",
    "crates/tailor/store",
    "crates/tailor/render",
    "crates/tailor/app",
    "crates/tailor/mcp",
]

[workspace.package]
version = "1.6.0"
edition = "2021"
license = "MIT"
authors = ["Wess Cope <opensource@wess.io>"]
repository = "https://github.com/wess/guise"
homepage = "https://github.com/wess/guise"
documentation = "https://docs.rs/guise"
keywords = ["gpui", "ui", "components", "desktop"]
categories = ["gui"]

[workspace.dependencies]
gpui = "0.2.2"
guise-ui = { path = "crates/guise" }

# Tailor — the visual interface builder that ships in this repo. Its crates are
# `publish = false`; the library above is the only thing that goes to crates.io.
tailor-model = { path = "crates/tailor/model" }
tailor-codegen = { path = "crates/tailor/codegen" }
tailor-store = { path = "crates/tailor/store" }
tailor-render = { path = "crates/tailor/render" }

# Only the Tailor crates use these — the library stays gpui + std.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "6"

[profile.dev]
debug = "limited"

# What this repo's own binaries are built with. A library's profile does not
# reach its consumers — Cargo only reads the one in the final crate's workspace
# — so this is for the gallery and the examples, and doubles as the recipe an
# app can copy. On the gallery it takes 13.2 MB to 7.5 MB.
#
# `panic = "abort"` drops ~1.5 MB of landing pads and unwind tables. It costs
# nothing in behaviour: gpui only catches panics in its test harness, which
# Cargo builds under the test profile with unwinding forced back on.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
