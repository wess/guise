[workspace]
resolver = "2"
members = [
    "crates/guise",
    "crates/gallery",
]

[workspace.package]
version = "1.6.1"
edition = "2021"
license = "MIT"
authors = ["Wess Cope <opensource@wess.io>"]
repository = "https://github.com/wess/guise"
homepage = "https://github.com/wess/guise"
documentation = "https://docs.rs/guise"
keywords = ["gpui", "ui", "components", "desktop"]
categories = ["gui"]

[workspace.dependencies]
gpui = "0.2.2"
guise-ui = { path = "crates/guise" }

[profile.dev]
debug = "limited"

# What this repo's own binaries are built with. A library's profile does not
# reach its consumers — Cargo only reads the one in the final crate's workspace
# — so this is for the gallery and the examples, and doubles as the recipe an
# app can copy. On the gallery it takes 13.2 MB to 7.5 MB.
#
# `panic = "abort"` drops ~1.5 MB of landing pads and unwind tables. It costs
# nothing in behaviour: gpui only catches panics in its test harness, which
# Cargo builds under the test profile with unwinding forced back on.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
