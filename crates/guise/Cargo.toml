[package]
name = "guise-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "A component library for gpui, Zed's GPU-accelerated UI framework: a themed palette, sizing tokens, 130+ composable components, a reactive state layer, and an in-app Safari-style inspector."
readme = "README.md"

# Published to crates.io as `guise-ui` (the `guise` name was taken), but the
# library is imported as `guise` — so `use guise::…` is unchanged for callers.
[lib]
name = "guise"

# docs.rs builds on Linux, where `webview` is a no-op anyway; the WebView API
# appears either way.
[package.metadata.docs.rs]
no-default-features = true

[features]
default = ["webview"]
# Embed a native OS web view via `wry` (macOS and Windows). Linux is not
# supported — gpui gives wry no window handle it accepts — so there the feature
# is a no-op: `wry` is not built, no WebKitGTK is needed, and `WebView` renders
# the themed placeholder with the same API, as it does with the feature off.
webview = ["dep:wry"]
# Tree-sitter syntax highlighting for `Editor` (`TreeSitterHighlighter`).
# Ships no grammars — pass a grammar crate's `LANGUAGE` and highlight query,
# so only the languages an app actually uses get compiled in.
treesitter = ["dep:tree-sitter", "dep:tree-sitter-highlight"]

[dependencies]
gpui.workspace = true
# Frames for `VideoView` are built as `image::Frame`s, which is what gpui's
# `RenderImage` takes. Already in the tree through gpui; no decoders wanted.
image = { version = "0.25", default-features = false }
tree-sitter = { version = "0.25", optional = true }
tree-sitter-highlight = { version = "0.25", optional = true }

[target.'cfg(not(target_os = "linux"))'.dependencies]
wry = { version = "0.55", optional = true }

[dev-dependencies]
# Entity-level tests (`#[gpui::test]` + `TestAppContext`) — the same harness
# zed's own tests run on.
gpui = { version = "0.2.2", features = ["test-support"] }
# The tree-sitter adapter compiles under `cfg(any(test, feature))`, so plain
# `cargo test` exercises it against a real grammar without the feature.
tree-sitter = "0.25"
tree-sitter-highlight = "0.25"
tree-sitter-rust = "0.24"
